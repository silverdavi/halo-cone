<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- System fontconfig plus the TeX Live copy of TeX Gyre Heros, so cairosvg uses the paper font. -->
<fontconfig>
  <include ignore_missing="yes">/opt/homebrew/etc/fonts/fonts.conf</include>
  <dir>/usr/local/texlive/2025/texmf-dist/fonts/opentype/public/tex-gyre</dir>
  <cachedir>~/.cache/fontconfig</cachedir>
</fontconfig>
